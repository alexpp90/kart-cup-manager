# Addresses and names on the Pi's own "Kart Cup" Wi-Fi (dnsmasq, wlan0 only).
interface=wlan0
bind-interfaces
domain-needed
bogus-priv
dhcp-authoritative
dhcp-range=10.42.0.10,10.42.0.250,255.255.255.0,1h
dhcp-option=option:router,10.42.0.1
dhcp-option=option:dns-server,10.42.0.1
# Captive portal hint (RFC 8910): phones open this page after joining.
dhcp-option=114,"http://kartcup.lan/join"
conf-file=/etc/kart-cup/kart-cup-dns.conf
